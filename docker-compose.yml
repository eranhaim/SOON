# Local development database. Production compose file will live in /deploy.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soon
      POSTGRES_PASSWORD: soon_dev_password
      POSTGRES_DB: soon
    ports:
      - "5432:5432"
    volumes:
      - soon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soon -d soon"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  soon_pgdata:
